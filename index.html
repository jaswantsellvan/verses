<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Verses</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>📝</text></svg>">

<style>
:root{
  --bg:#f5f2f8;
  --surface:#ffffff;
  --surface-soft:#eeeaf4;
  --text:#292536;
  --muted:#81798d;
  --border:#ddd7e7;
  --accent:#7567a8;
  --accent-light:#a99dce;
  --accent-text:#ffffff;
  --nature:#668b70;
  --love:#b96b83;
  --appreciation:#b08a52;
  --shadow:0 10px 30px rgba(55,45,80,.07);
  --shadow-hover:0 18px 40px rgba(55,45,80,.13);
}

@media (prefers-color-scheme: dark){
  :root{
    --bg:#181620;
    --surface:#24212d;
    --surface-soft:#2d2938;
    --text:#eeeaf5;
    --muted:#a8a0b5;
    --border:#403a4d;
    --accent:#aa9bd3;
    --accent-light:#c5b9e5;
    --accent-text:#211d2b;
    --nature:#88ad91;
    --love:#d9879e;
    --appreciation:#d6b16e;
    --shadow:0 10px 30px rgba(0,0,0,.25);
    --shadow-hover:0 18px 40px rgba(0,0,0,.38);
  }
}

*{
  box-sizing:border-box;
  font-family:Georgia,'Times New Roman',serif;
}

html{
  scroll-behavior:smooth;
}

body{
  margin:0;
  background:
    radial-gradient(circle at 10% 10%, rgba(139,94,70,.08), transparent 28%),
    radial-gradient(circle at 90% 25%, rgba(99,132,91,.07), transparent 25%),
    radial-gradient(circle at 50% 100%, rgba(173,82,104,.05), transparent 30%),
    var(--bg);
  color:var(--text);
  min-height:100vh;
  overflow-x:hidden;
}

body::before{
  content:"";
  position:fixed;
  width:260px;
  height:260px;
  border-radius:50%;
  background:var(--accent);
  opacity:.035;
  filter:blur(60px);
  top:12%;
  left:-100px;
  pointer-events:none;
  animation:floatOrb 10s ease-in-out infinite alternate;
}

body::after{
  content:"";
  position:fixed;
  width:220px;
  height:220px;
  border-radius:50%;
  background:var(--love);
  opacity:.035;
  filter:blur(60px);
  bottom:5%;
  right:-90px;
  pointer-events:none;
  animation:floatOrb2 13s ease-in-out infinite alternate;
}

::-webkit-scrollbar{
  width:10px;
  height:10px;
}

::-webkit-scrollbar-track{
  background:transparent;
}

::-webkit-scrollbar-thumb{
  background:var(--accent-light);
  border-radius:10px;
}

::-webkit-scrollbar-thumb:hover{
  background:var(--accent);
}

#app{
  max-width:680px;
  margin:0 auto;
  min-height:100vh;
  display:flex;
  flex-direction:column;
  position:relative;
}

#app.mood-nature{
  --accent:var(--nature);
}

#app.mood-love{
  --accent:var(--love);
}

#app.mood-appreciation{
  --accent:var(--appreciation);
}

#app.mood-nature main,
#app.mood-love main,
#app.mood-appreciation main{
  transition:background .5s ease;
}

#app.mood-nature main{
  background:radial-gradient(
    circle at 50% -10%,
    color-mix(in srgb, var(--nature) 16%, transparent),
    transparent 65%
  );
}

#app.mood-love main{
  background:radial-gradient(
    circle at 50% -10%,
    color-mix(in srgb, var(--love) 16%, transparent),
    transparent 65%
  );
}

#app.mood-appreciation main{
  background:radial-gradient(
    circle at 50% -10%,
    color-mix(in srgb, var(--appreciation) 16%, transparent),
    transparent 65%
  );
}

.welcome{
  min-height:100vh;
  display:flex;
  align-items:center;
  justify-content:center;
  padding:20px;
}

.welcome-inner{
  max-width:420px;
  text-align:center;
  animation:authAppear .8s cubic-bezier(.2,.8,.2,1) both;
}

.welcome-title{
  font-size:2.7rem;
  letter-spacing:1px;
  margin:0 0 30px;
}

.welcome-title::first-letter{
  color:var(--accent);
}

.welcome-quote{
  font-size:1.08rem;
  font-style:italic;
  color:var(--muted);
  line-height:1.75;
  margin:0 0 16px;
  min-height:84px;
  transition:opacity .25s ease;
}

.welcome-shuffle{
  background:none;
  border:none;
  color:var(--accent);
  font-size:.8rem;
  cursor:pointer;
  font-family:inherit;
  margin:0 0 32px;
  opacity:.75;
  transition:opacity .2s ease;
}

.welcome-shuffle:hover{
  opacity:1;
}

header{
  position:sticky;
  top:0;
  background:color-mix(in srgb,var(--bg) 88%,transparent);
  backdrop-filter:blur(18px);
  -webkit-backdrop-filter:blur(18px);
  z-index:5;
  padding:22px 22px 0;
  border-bottom:1px solid color-mix(in srgb,var(--border) 80%,transparent);
  animation:headerDrop .55s ease both;
}

h1{
  font-size:1.55rem;
  margin:0 0 17px;
  letter-spacing:.8px;
  display:flex;
  justify-content:space-between;
  align-items:center;
  animation:fadeUp .6s ease both;
}

h1::first-letter{
  color:var(--accent);
}

#signout{
  font-size:.72rem;
  color:var(--muted);
  background:color-mix(in srgb,var(--surface) 70%,transparent);
  border:1px solid var(--border);
  border-radius:20px;
  padding:6px 13px;
  cursor:pointer;
  font-family:inherit;
  transition:
    transform .2s ease,
    color .2s ease,
    border-color .2s ease,
    background .2s ease;
}

#signout:hover{
  transform:translateY(-2px);
  color:var(--accent);
  border-color:var(--accent-light);
  background:var(--surface);
}

nav{
  display:flex;
  gap:4px;
}

nav button{
  position:relative;
  flex:1;
  background:none;
  border:none;
  padding:11px 6px 13px;
  font-size:.92rem;
  color:var(--muted);
  cursor:pointer;
  border-bottom:2px solid transparent;
  font-family:inherit;
  transition:
    color .25s ease,
    transform .2s ease;
}

nav button:hover{
  color:var(--text);
  transform:translateY(-1px);
}

nav button.active{
  color:var(--accent);
  border-bottom-color:var(--accent);
  font-weight:bold;
}

nav button.active::after{
  content:"";
  position:absolute;
  left:35%;
  right:35%;
  bottom:-2px;
  height:4px;
  border-radius:10px;
  background:var(--accent);
  filter:blur(3px);
  opacity:.35;
}

main{
  flex:1;
  padding:28px 22px 50px;
  animation:pageIn .45s ease both;
}

main > *{
  animation:fadeUp .5s ease both;
}

.cat-grid{
  display:grid;
  grid-template-columns:1fr;
  gap:14px;
  margin-top:16px;
}

.cat-btn{
  position:relative;
  overflow:hidden;
  padding:22px;
  border-radius:18px;
  border:1px solid var(--border);
  background:
    linear-gradient(
      135deg,
      color-mix(in srgb,var(--surface) 96%,var(--accent)),
      var(--surface)
    );
  text-align:left;
  cursor:pointer;
  font-size:1.05rem;
  color:var(--text);
  display:flex;
  align-items:center;
  gap:15px;
  box-shadow:var(--shadow);
  transition:
    transform .25s cubic-bezier(.2,.8,.2,1),
    box-shadow .25s ease,
    border-color .25s ease;
}

.cat-btn::before{
  content:"";
  position:absolute;
  inset:0;
  background:
    linear-gradient(
      110deg,
      transparent 25%,
      rgba(255,255,255,.18) 50%,
      transparent 75%
    );
  transform:translateX(-120%);
  transition:transform .55s ease;
}

.cat-btn:hover{
  transform:translateY(-5px) scale(1.01);
  box-shadow:var(--shadow-hover);
  border-color:color-mix(in srgb,var(--accent) 45%,var(--border));
}

.cat-btn:hover::before{
  transform:translateX(120%);
}

.cat-btn:active{
  transform:translateY(-1px) scale(.99);
}

.cat-btn .dot{
  width:13px;
  height:13px;
  border-radius:50%;
  flex-shrink:0;
  box-shadow:
    0 0 0 5px
    color-mix(in srgb,var(--accent) 7%,transparent);
  transition:transform .25s ease;
}

.cat-btn:hover .dot{
  transform:scale(1.35);
}

label{
  display:block;
  font-size:.76rem;
  color:var(--muted);
  margin:18px 0 7px;
  text-transform:uppercase;
  letter-spacing:.7px;
}

input[type=text],
input[type=email],
input[type=password],
textarea{
  width:100%;
  padding:14px 15px;
  border-radius:13px;
  border:1px solid var(--border);
  background:color-mix(in srgb,var(--surface) 94%,var(--accent));
  color:var(--text);
  font-size:1rem;
  font-family:inherit;
  outline:none;
  transition:
    border-color .25s ease,
    box-shadow .25s ease,
    background .25s ease,
    transform .2s ease;
}

input[type=text]:focus,
input[type=email]:focus,
input[type=password]:focus,
textarea:focus{
  border-color:var(--accent-light);
  box-shadow:
    0 0 0 4px
    color-mix(in srgb,var(--accent) 10%,transparent),
    0 8px 25px rgba(70,48,30,.05);
  background:var(--surface);
  transform:translateY(-1px);
}

textarea{
  min-height:250px;
  resize:vertical;
  line-height:1.75;
}

.primary{
  position:relative;
  overflow:hidden;
  background:
    linear-gradient(
      135deg,
      var(--accent),
      color-mix(in srgb,var(--accent) 72%,#000)
    );
  color:var(--accent-text);
  border:none;
  padding:14px 20px;
  border-radius:13px;
  font-size:1rem;
  cursor:pointer;
  font-family:inherit;
  width:100%;
  margin-top:20px;
  box-shadow:
    0 8px 20px
    color-mix(in srgb,var(--accent) 20%,transparent);
  transition:
    transform .22s ease,
    box-shadow .22s ease,
    background .3s ease;
}

.primary::after{
  content:"";
  position:absolute;
  width:80px;
  height:100%;
  top:0;
  left:-100px;
  background:rgba(255,255,255,.18);
  transform:skewX(-20deg);
  transition:left .5s ease;
}

.primary:hover{
  transform:translateY(-3px);
  box-shadow:
    0 13px 28px
    color-mix(in srgb,var(--accent) 28%,transparent);
}

.primary:hover::after{
  left:120%;
}

.primary:active{
  transform:translateY(-1px);
}

.choice-grid{
  display:grid;
  gap:15px;
  margin-top:22px;
}

.choice-card{
  position:relative;
  overflow:hidden;
  padding:24px;
  border-radius:18px;
  border:1px solid var(--border);
  background:var(--surface);
  cursor:pointer;
  text-align:left;
  box-shadow:var(--shadow);
  transition:
    transform .25s cubic-bezier(.2,.8,.2,1),
    box-shadow .25s ease,
    border-color .25s ease,
    background .25s ease;
}

.choice-card:hover{
  transform:translateY(-5px);
  box-shadow:var(--shadow-hover);
  border-color:color-mix(in srgb,var(--accent) 45%,var(--border));
}

.choice-card.selected{
  border:2px solid var(--accent);
  background:color-mix(in srgb,var(--accent) 10%,var(--surface));
  box-shadow:
    0 0 0 3px
    color-mix(in srgb,var(--accent) 8%,transparent),
    var(--shadow-hover);
}

.choice-card.selected h3::after{
  content:" ✓";
  color:var(--accent);
  animation:checkPop .35s ease both;
}

.choice-card h3{
  margin:0 0 7px;
  font-size:1.08rem;
}

.choice-card p{
  margin:0;
  color:var(--muted);
  font-size:.9rem;
  line-height:1.5;
}

.poem-card{
  --rot:0deg;
  position:relative;
  overflow:hidden;
  border:1px solid var(--border);
  background:
    linear-gradient(
      145deg,
      var(--surface),
      color-mix(in srgb,var(--surface) 94%,var(--accent))
    );
  border-radius:18px;
  padding:19px 20px;
  margin-bottom:18px;
  box-shadow:var(--shadow);
  transform:rotate(var(--rot));
  transition:
    transform .28s cubic-bezier(.2,.8,.2,1),
    box-shadow .28s ease,
    border-color .28s ease;
  animation:cardAppear .5s ease both;
}

.poem-card:nth-child(odd){
  --rot:-0.6deg;
}

.poem-card:nth-child(even){
  --rot:0.55deg;
}

.poem-card::before{
  content:"“";
  position:absolute;
  right:15px;
  top:-13px;
  font-size:6rem;
  line-height:1;
  color:var(--accent);
  opacity:.055;
  pointer-events:none;
}

.poem-card::after{
  content:"";
  position:absolute;
  top:-9px;
  left:24px;
  width:44px;
  height:15px;
  background:color-mix(in srgb,var(--accent) 60%,transparent);
  opacity:.5;
  transform:rotate(-4deg);
  border-radius:2px;
  box-shadow:0 2px 5px rgba(0,0,0,.12);
}

.poem-card:hover{
  transform:rotate(var(--rot)) translateY(-5px);
  box-shadow:var(--shadow-hover);
  border-color:color-mix(in srgb,var(--accent) 30%,var(--border));
}

.poem-card .tag{
  display:inline-block;
  font-size:.68rem;
  padding:4px 10px;
  border-radius:20px;
  color:#fff;
  margin-bottom:10px;
  letter-spacing:.2px;
  box-shadow:0 4px 10px rgba(0,0,0,.08);
}

.poem-card h3{
  margin:0 0 4px;
  font-size:1.15rem;
  letter-spacing:.1px;
}

.poem-card .author{
  font-size:.78rem;
  color:var(--accent);
  margin:0 0 10px;
}

.poem-card .body{
  white-space:pre-line;
  line-height:1.7;
  font-size:.97rem;
  color:color-mix(in srgb,var(--text) 92%,var(--muted));
}

.poem-card .meta{
  margin-top:14px;
  padding-top:10px;
  border-top:1px solid color-mix(in srgb,var(--border) 65%,transparent);
  display:flex;
  justify-content:space-between;
  align-items:center;
}

.poem-card .meta span{
  font-size:.73rem;
  color:var(--muted);
}

.del{
  background:none;
  border:none;
  color:var(--muted);
  font-size:.78rem;
  cursor:pointer;
  text-decoration:none;
  transition:color .2s ease;
}

.del:hover{
  color:#c0392b;
}

/* ACTION BUTTONS FOR EDIT / MAKE PUBLIC */

.poem-actions{
  display:flex;
  gap:10px;
  align-items:center;
  flex-wrap:wrap;
}

.action-btn{
  background:none;
  border:1px solid var(--border);
  color:var(--muted);
  border-radius:18px;
  padding:5px 11px;
  font-size:.72rem;
  cursor:pointer;
  font-family:inherit;
  transition:all .2s ease;
}

.action-btn:hover{
  color:var(--accent);
  border-color:var(--accent-light);
  transform:translateY(-1px);
}

.action-btn.edit-btn:hover{
  color:var(--accent);
}

.action-btn.public-btn:hover{
  color:var(--nature);
  border-color:var(--nature);
}

.action-btn.cancel-btn:hover{
  color:#c0392b;
  border-color:#c0392b;
}

.edit-category-row{
  display:flex;
  gap:8px;
  flex-wrap:wrap;
  margin:10px 0 4px;
}

.edit-category-btn{
  padding:7px 13px;
  border-radius:20px;
  border:1px solid var(--border);
  background:var(--surface);
  color:var(--muted);
  font-size:.78rem;
  cursor:pointer;
  font-family:inherit;
  transition:all .2s ease;
}

.edit-category-btn:hover{
  border-color:var(--accent-light);
  color:var(--text);
}

.edit-category-btn.selected{
  background:var(--accent);
  color:var(--accent-text);
  border-color:var(--accent);
}

.empty{
  color:var(--muted);
  text-align:center;
  padding:65px 20px;
  font-size:.95rem;
  animation:fadeUp .6s ease both;
}

.empty-icon{
  display:block;
  width:42px;
  height:42px;
  margin:0 auto 14px;
  color:var(--accent);
  opacity:.45;
  animation:softPulse 2.5s ease-in-out infinite;
}

.stepback{
  background:none;
  border:none;
  color:var(--muted);
  cursor:pointer;
  font-size:.85rem;
  padding:0;
  margin-bottom:8px;
  font-family:inherit;
  transition:
    color .2s ease,
    transform .2s ease;
}

.stepback:hover{
  color:var(--accent);
  transform:translateX(-4px);
}

.authbox{
  max-width:360px;
  margin:90px auto;
  padding:30px 24px;
  border:1px solid var(--border);
  border-radius:22px;
  background:color-mix(in srgb,var(--surface) 88%,transparent);
  backdrop-filter:blur(15px);
  -webkit-backdrop-filter:blur(15px);
  box-shadow:var(--shadow-hover);
  animation:authAppear .7s cubic-bezier(.2,.8,.2,1) both;
}

.authbox h2{
  text-align:center;
  margin-top:0;
  margin-bottom:26px;
  font-size:1.45rem;
  letter-spacing:.2px;
}

.authbox .sub{
  text-align:center;
  font-size:.85rem;
  color:var(--muted);
  margin-top:-16px;
  margin-bottom:22px;
}

.toggle{
  text-align:center;
  margin-top:17px;
  font-size:.85rem;
  color:var(--muted);
}

.toggle a{
  color:var(--accent);
  cursor:pointer;
  text-decoration:underline;
  text-underline-offset:3px;
}

.err{
  color:#c0392b;
  font-size:.85rem;
  margin-top:8px;
  text-align:center;
}

.filter-row{
  display:flex;
  gap:8px;
  flex-wrap:wrap;
  margin:0 0 20px;
}

.chip{
  padding:7px 15px;
  border-radius:20px;
  border:1px solid var(--border);
  background:var(--surface);
  color:var(--muted);
  font-size:.82rem;
  cursor:pointer;
  font-family:inherit;
  transition:all .2s ease;
}

.chip:hover{
  border-color:var(--accent-light);
  color:var(--text);
}

.chip.active{
  background:var(--accent);
  color:var(--accent-text);
  border-color:var(--accent);
}

/*
  ORIGINAL PUBLIC POEM LAYOUT
  This is intentionally kept as CSS columns
  to preserve the original appearance.
*/

.gallery{
  columns:2;
  column-gap:16px;
}

.gallery .poem-card{
  break-inside:avoid;
  display:inline-block;
  width:100%;
}

@media(max-width:600px){
  .gallery{
    columns:1;
  }
}

@keyframes fadeUp{
  from{
    opacity:0;
    transform:translateY(12px);
  }
  to{
    opacity:1;
    transform:translateY(0);
  }
}

@keyframes pageIn{
  from{
    opacity:0;
  }
  to{
    opacity:1;
  }
}

@keyframes headerDrop{
  from{
    opacity:0;
    transform:translateY(-12px);
  }
  to{
    opacity:1;
    transform:translateY(0);
  }
}

@keyframes cardAppear{
  from{
    opacity:0;
    transform:translateY(15px);
  }
  to{
    opacity:1;
    transform:translateY(0);
  }
}

@keyframes authAppear{
  from{
    opacity:0;
    transform:translateY(20px) scale(.97);
  }
  to{
    opacity:1;
    transform:translateY(0) scale(1);
  }
}

@keyframes checkPop{
  0%{
    opacity:0;
    transform:scale(.4);
  }
  70%{
    transform:scale(1.25);
  }
  100%{
    opacity:1;
    transform:scale(1);
  }
}

@keyframes softPulse{
  0%,100%{
    transform:scale(1);
    opacity:.4;
  }
  50%{
    transform:scale(1.15);
    opacity:.75;
  }
}

@keyframes floatOrb{
  from{
    transform:translate(0,0);
  }
  to{
    transform:translate(70px,40px);
  }
}

@keyframes floatOrb2{
  from{
    transform:translate(0,0);
  }
  to{
    transform:translate(-60px,-35px);
  }
}

@media (prefers-reduced-motion:reduce){
  *,
  *::before,
  *::after{
    animation-duration:.01ms !important;
    animation-iteration-count:1 !important;
    transition-duration:.01ms !important;
    scroll-behavior:auto !important;
  }
}

@media(max-width:500px){
  header{
    padding:18px 16px 0;
  }

  main{
    padding:23px 16px 40px;
  }

  h1{
    font-size:1.4rem;
  }

  .cat-btn{
    padding:20px;
  }

  .choice-card{
    padding:21px;
  }

  .authbox{
    margin:60px 18px;
  }

  .welcome-title{
    font-size:2.2rem;
  }
}
</style>
</head>

<body>

<div id="app"></div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.js"></script>

<script>
const SUPABASE_URL = "https://jwggaptrrsazfhimvgnv.supabase.co";
const SUPABASE_ANON_KEY = "sb_publishable_-O38DjBdOAxsgyPb1EdjJQ_BjNx4xR8";

const sb = supabase.createClient(
  SUPABASE_URL,
  SUPABASE_ANON_KEY
);

const CATS = [
  { name:'Nature', color:'var(--nature)' },
  { name:'Love', color:'var(--love)' },
  { name:'Appreciation', color:'var(--appreciation)' }
];

const QUOTES = [
  "The words you're afraid to write are usually the ones worth writing.",
  "A poem doesn't need permission to exist — only a page.",
  "What you love, write toward. What you fear, write through.",
  "Every unfinished draft is still further along than the blank page.",
  "Write it for the version of you who needed to read it first.",
  "Passion rarely arrives polished. Let it arrive anyway.",
  "The heart doesn't edit itself before it feels something — don't ask your pen to either.",
  "Somewhere, a line you haven't written yet is waiting to become true.",
  "Small and honest beats grand and borrowed, every time.",
  "You don't find the words. You make room, and they arrive."
];

function pickQuote(){
  return QUOTES[Math.floor(Math.random()*QUOTES.length)];
}

let currentQuote = pickQuote();

let entered = false;
let session = null;
let authMode = 'login';

let state = {
  tab:'write',
  step:'category',
  category:null,
  title:'',
  body:'',
  publicFilter:'All',
  editId:null
};

let personalDocs = [];
let publicDocs = [];

function esc(s){
  const d = document.createElement('div');
  d.textContent = s ?? '';
  return d.innerHTML;
}

function fmtDate(ts){
  try{
    return new Date(ts).toLocaleDateString(undefined,{
      month:'short',
      day:'numeric',
      year:'numeric'
    });
  }catch(e){
    return '';
  }
}

function emptyIcon(){
  return `<svg
    class="empty-icon"
    viewBox="0 0 24 24"
    fill="none"
    stroke="currentColor"
    stroke-width="1.3"
    stroke-linecap="round"
    stroke-linejoin="round">
    <path d="M12 2C8 8 5 11.5 5 15a7 7 0 0 0 14 0c0-3.5-3-7-7-13Z"/>
  </svg>`;
}

function updateMood(){
  const app = document.getElementById('app');

  if(!app) return;

  app.classList.remove(
    'mood-nature',
    'mood-love',
    'mood-appreciation'
  );

  if(
    session &&
    state.tab === 'write' &&
    state.step !== 'category' &&
    state.category
  ){
    app.classList.add(
      'mood-' + state.category.toLowerCase()
    );
  }
}

async function render(){

  const app = document.getElementById('app');

  if(!entered){
    app.innerHTML = renderWelcome();
    wireWelcome();
    return;
  }

  if(!session){
    app.innerHTML = renderAuth();
    wireAuth();
    return;
  }

  if(
    !session.user.user_metadata ||
    !session.user.user_metadata.pen_name
  ){
    app.innerHTML = renderPenName();
    wirePenName();
    return;
  }

  app.innerHTML = `
    <header>
      <h1>
        Verses
        <button id="signout">sign out</button>
      </h1>

      <nav>
        <button
          data-tab="write"
          class="${state.tab === 'write' ? 'active' : ''}">
          Write
        </button>

        <button
          data-tab="personal"
          class="${state.tab === 'personal' ? 'active' : ''}">
          Personal
        </button>

        <button
          data-tab="public"
          class="${state.tab === 'public' ? 'active' : ''}">
          Public
        </button>
      </nav>
    </header>

    <main id="main"></main>
  `;

  document.getElementById('signout').onclick =
    async ()=>{
      await sb.auth.signOut();
    };

  document.querySelectorAll('nav button').forEach(b=>{

    b.onclick = ()=>{

      if(state.tab === 'write'){

        const t = document.getElementById('titleInput');
        const bI = document.getElementById('bodyInput');

        if(t) state.title = t.value;
        if(bI) state.body = bI.value;
      }

      state.tab = b.dataset.tab;

      render();
    };
  });

  renderMain();

  if(state.tab !== 'write'){
    loadList(state.tab);
  }
}

function renderWelcome(){

  return `
    <div class="welcome">

      <div class="welcome-inner">

        <div class="welcome-title">
          Verses
        </div>

        <p
          class="welcome-quote"
          id="welcomeQuote">
          ${esc(currentQuote)}
        </p>

        <button
          class="welcome-shuffle"
          id="shuffleQuote">
          ✦ another thought
        </button>

        <button
          class="primary"
          id="enterBtn"
          style="margin-top:0">
          Enter
        </button>

      </div>

    </div>
  `;
}

function wireWelcome(){

  document.getElementById('shuffleQuote').onclick = ()=>{

    const q = document.getElementById('welcomeQuote');

    q.style.opacity = 0;

    setTimeout(()=>{

      currentQuote = pickQuote();

      q.textContent = currentQuote;

      q.style.opacity = 1;

    },180);
  };

  document.getElementById('enterBtn').onclick = ()=>{
    entered = true;
    render();
  };
}

function renderAuth(){

  return `
    <div class="authbox">

      <h2>
        ${authMode === 'login'
          ? 'Welcome back'
          : 'Create your account'}
      </h2>

      <label>Email</label>

      <input
        type="email"
        id="authEmail">

      <label>Password</label>

      <input
        type="password"
        id="authPass">

      <div
        class="err"
        id="authErr">
      </div>

      <button
        class="primary"
        id="authSubmit">
        ${authMode === 'login'
          ? 'Log in'
          : 'Sign up'}
      </button>

      <div class="toggle">

        ${
          authMode === 'login'
            ? `No account yet? <a id="toSignup">Sign up</a>`
            : `Already have an account? <a id="toLogin">Log in</a>`
        }

      </div>

    </div>
  `;
}

function wireAuth(){

  const toS = document.getElementById('toSignup');
  const toL = document.getElementById('toLogin');

  if(toS){
    toS.onclick = ()=>{
      authMode = 'signup';
      render();
    };
  }

  if(toL){
    toL.onclick = ()=>{
      authMode = 'login';
      render();
    };
  }

  document.getElementById('authSubmit').onclick =
    async ()=>{

      const email =
        document.getElementById('authEmail').value.trim();

      const password =
        document.getElementById('authPass').value;

      const errEl =
        document.getElementById('authErr');

      errEl.textContent = '';

      if(!email || !password){
        errEl.textContent =
          'Enter an email and password.';
        return;
      }

      const { error } =
        authMode === 'login'
          ? await sb.auth.signInWithPassword({
              email,
              password
            })
          : await sb.auth.signUp({
              email,
              password
            });

      if(error){
        errEl.textContent = error.message;
      }
      else if(authMode === 'signup'){
        errEl.textContent =
          'Check your email to confirm your account, then log in.';
      }
    };
}

function renderPenName(){

  return `
    <div class="authbox">

      <h2>Choose a pen name</h2>

      <div class="sub">
        This is how you'll be credited on public poems.
      </div>

      <label>Pen name</label>

      <input
        type="text"
        id="penNameInput"
        placeholder="e.g. Wren">

      <div
        class="err"
        id="penErr">
      </div>

      <button
        class="primary"
        id="penSubmit">
        Continue
      </button>

    </div>
  `;
}

function wirePenName(){

  document.getElementById('penSubmit').onclick =
    async ()=>{

      const name =
        document.getElementById('penNameInput')
        .value
        .trim();

      const errEl =
        document.getElementById('penErr');

      if(!name){
        errEl.textContent =
          'Enter a pen name.';
        return;
      }

      const { data, error } =
        await sb.auth.updateUser({
          data:{
            pen_name:name
          }
        });

      if(error){
        errEl.textContent = error.message;
        return;
      }

      session.user = data.user;

      render();
    };
}

/*
  IMPORTANT:
  Edit mode is checked FIRST.

  This allows editing a public poem while
  state.tab remains "public".
*/
function renderMain(){

  const main =
    document.getElementById('main');

  if(!main) return;

  if(state.step === 'edit'){

    main.innerHTML = renderEdit();

  }
  else if(state.tab === 'write'){

    main.innerHTML = renderWrite();

  }
  else if(state.tab === 'public'){

    main.innerHTML = renderPublicSection();

  }
  else{

    main.innerHTML =
      renderList(personalDocs,true);

  }

  wireMain();

  updateMood();
}

function renderPublicSection(){

  const cats = [
    'All',
    ...CATS.map(c=>c.name)
  ];

  const chips =
    cats.map(c=>`
      <button
        class="chip ${state.publicFilter === c ? 'active' : ''}"
        data-filter="${c}">
        ${c}
      </button>
    `).join('');

  const filtered =
    state.publicFilter === 'All'
      ? publicDocs
      : publicDocs.filter(
          d=>d.category === state.publicFilter
        );

  return `
    <div class="filter-row">
      ${chips}
    </div>

    <div class="gallery">
      ${renderList(filtered,false)}
    </div>
  `;
}

function renderWrite(){

  if(state.step === 'category'){

    return `
      <p style="color:var(--muted);margin-top:0">
        What kind of poem or story is this?
      </p>

      <div class="cat-grid">

        ${
          CATS.map(c=>`
            <button
              class="cat-btn"
              data-cat="${c.name}">

              <span
                class="dot"
                style="background:${c.color}">
              </span>

              ${c.name}

            </button>
          `).join('')
        }

      </div>
    `;
  }

  if(state.step === 'write'){

    return `
      <button
        class="stepback"
        data-back="category">
        &larr; Back
      </button>

      <p style="color:var(--muted);margin-top:0">
        Category:
        <b style="color:var(--text)">
          ${esc(state.category)}
        </b>
      </p>

      <label>Title</label>

      <input
        type="text"
        id="titleInput"
        placeholder="Give it a title"
        value="${esc(state.title)}">

      <label>Your words</label>

      <textarea
        id="bodyInput"
        placeholder="Write here...">${esc(state.body)}</textarea>

      <button
        class="primary"
        id="nextBtn">
        Next
      </button>
    `;
  }

  return `
    <button
      class="stepback"
      data-back="write">
      &larr; Back
    </button>

    <p style="color:var(--muted);margin-top:0">
      Where should this go?
    </p>

    <div class="choice-grid">

      <button
        class="choice-card"
        id="choosePersonal">

        <h3>Keep Personal</h3>

        <p>
          Only you can see it.
        </p>

      </button>

      <button
        class="choice-card"
        id="choosePublic">

        <h3>Post Publicly</h3>

        <p>
          Any logged-in user on this site can read it.
        </p>

      </button>

    </div>
  `;
}

/*
  EDIT PUBLIC POEM
*/
function renderEdit(){

  const cats =
    CATS.map(c=>`
      <button
        class="edit-category-btn ${
          state.category === c.name
            ? 'selected'
            : ''
        }"
        data-edit-cat="${c.name}">
        ${c.name}
      </button>
    `).join('');

  return `
    <button
      class="stepback"
      data-cancel-edit="true">
      &larr; Back to Public
    </button>

    <p style="color:var(--muted);margin-top:0">
      Editing your public poem
    </p>

    <label>Category</label>

    <div class="edit-category-row">
      ${cats}
    </div>

    <label>Title</label>

    <input
      type="text"
      id="titleInput"
      placeholder="Give it a title"
      value="${esc(state.title)}">

    <label>Your words</label>

    <textarea
      id="bodyInput"
      placeholder="Write here...">${esc(state.body)}</textarea>

    <div
      style="
        display:flex;
        gap:10px;
        margin-top:20px;
      ">

      <button
        class="primary"
        id="saveEditBtn"
        style="margin-top:0">
        Save Changes
      </button>

      <button
        class="action-btn cancel-btn"
        id="cancelEditBtn"
        style="
          padding:0 18px;
          border-radius:13px;
        ">
        Cancel
      </button>

    </div>
  `;
}

function renderList(docs,isPersonal){

  if(!docs){

    return `
      <div class="empty">
        ${emptyIcon()}
        Loading...
      </div>
    `;
  }

  if(!docs.length){

    return `
      <div class="empty">
        ${emptyIcon()}
        ${
          isPersonal
            ? 'Nothing saved yet.'
            : 'No public poems yet.'
        }
      </div>
    `;
  }

  return docs.map(d=>{

    const c =
      CATS.find(c=>c.name === d.category);

    const color =
      c ? c.color : 'var(--accent)';

    const isOwner =
      !!session &&
      d.user_id === session.user.id;

    const actions = isPersonal

      ? `
        <div class="poem-actions">

          ${
            isOwner
              ? `
                <button
                  class="action-btn public-btn"
                  data-public="${d.id}">
                  make public
                </button>

                <button
                  class="del"
                  data-del="${d.id}">
                  delete
                </button>
              `
              : ''
          }

        </div>
      `

      : (
        isOwner
          ? `
            <button
              class="action-btn edit-btn"
              data-edit="${d.id}">
              edit
            </button>
          `
          : ''
      );

    return `
      <div class="poem-card">

        <span
          class="tag"
          style="background:${color}">
          ${esc(d.category || '')}
        </span>

        <h3>
          ${esc(d.title || 'Untitled')}
        </h3>

        ${
          (!isPersonal && d.author_name)
            ? `
              <div class="author">
                — ${esc(d.author_name)}
              </div>
            `
            : ''
        }

        <div class="body">
          ${esc(d.body || '')}
        </div>

        <div class="meta">

          <span>
            ${fmtDate(d.created_at)}
          </span>

          ${actions}

        </div>

      </div>
    `;

  }).join('');
}

function wireMain(){

  /*
    CATEGORY BUTTONS
  */
  document.querySelectorAll('[data-cat]')
    .forEach(b=>{

      b.onclick = ()=>{

        state.category =
          b.dataset.cat;

        state.step = 'write';

        renderMain();
      };

    });

  /*
    BACK BUTTONS
  */
  const back =
    document.querySelector('[data-back]');

  if(back){

    back.onclick = ()=>{

      const t =
        document.getElementById('titleInput');

      const bI =
        document.getElementById('bodyInput');

      if(t) state.title = t.value;
      if(bI) state.body = bI.value;

      state.step =
        back.dataset.back;

      renderMain();
    };
  }

  /*
    CANCEL EDIT
  */
  const cancelEdit =
    document.querySelector(
      '[data-cancel-edit]'
    );

  if(cancelEdit){
    cancelEdit.onclick =
      cancelPoemEdit;
  }

  const cancelEditBtn =
    document.getElementById(
      'cancelEditBtn'
    );

  if(cancelEditBtn){
    cancelEditBtn.onclick =
      cancelPoemEdit;
  }

  /*
    EDIT CATEGORY
  */
  document.querySelectorAll(
    '[data-edit-cat]'
  ).forEach(b=>{

    b.onclick = ()=>{

      state.category =
        b.dataset.editCat;

      renderMain();
    };

  });

  /*
    TEXT INPUTS
  */
  const titleInput =
    document.getElementById(
      'titleInput'
    );

  if(titleInput){

    titleInput.oninput =
      ()=>{
        state.title =
          titleInput.value;
      };
  }

  const bodyInput =
    document.getElementById(
      'bodyInput'
    );

  if(bodyInput){

    bodyInput.oninput =
      ()=>{
        state.body =
          bodyInput.value;
      };
  }

  /*
    NEXT BUTTON
  */
  const next =
    document.getElementById(
      'nextBtn'
    );

  if(next){

    next.onclick = ()=>{

      const b =
        document
          .getElementById('bodyInput')
          ?.value
          .trim();

      if(!b){

        alert(
          'Write something first.'
        );

        return;
      }

      state.step = 'choose';

      renderMain();
    };
  }

  /*
    SAVE EDIT
  */
  const saveEditBtn =
    document.getElementById(
      'saveEditBtn'
    );

  if(saveEditBtn){

    saveEditBtn.onclick =
      updatePoem;
  }

  /*
    SAVE PERSONAL
  */
  const cp =
    document.getElementById(
      'choosePersonal'
    );

  if(cp){

    cp.onclick = ()=>{

      cp.classList.add(
        'selected'
      );

      savePoem('personal');
    };
  }

  /*
    SAVE PUBLIC
  */
  const cx =
    document.getElementById(
      'choosePublic'
    );

  if(cx){

    cx.onclick = ()=>{

      cx.classList.add(
        'selected'
      );

      savePoem('public');
    };
  }

  /*
    PUBLIC FILTERS
  */
  document.querySelectorAll(
    '[data-filter]'
  ).forEach(b=>{

    b.onclick = ()=>{

      state.publicFilter =
        b.dataset.filter;

      renderMain();
    };
  });

  /*
    EDIT PUBLIC POEM
  */
  document.querySelectorAll(
    '[data-edit]'
  ).forEach(b=>{

    b.onclick = ()=>{

      startPoemEdit(
        b.dataset.edit
      );
    };
  });

  /*
    MAKE PERSONAL POEM PUBLIC
  */
  document.querySelectorAll(
    '[data-public]'
  ).forEach(b=>{

    b.onclick = ()=>{

      makePublic(
        b.dataset.public
      );
    };
  });

  /*
    DELETE PERSONAL POEM
  */
  document.querySelectorAll(
    '[data-del]'
  ).forEach(b=>{

    b.onclick = async ()=>{

      if(!confirm(
        'Delete this poem?'
      )){
        return;
      }

      const { error } =
        await sb
          .from('poems')
          .delete()
          .eq(
            'id',
            b.dataset.del
          )
          .eq(
            'user_id',
            session.user.id
          );

      if(error){

        alert(
          'Could not delete: ' +
          error.message
        );

        return;
      }

      await loadList(
        'personal'
      );
    };
  });
}

/*
  START EDITING A PUBLIC POEM
*/
function startPoemEdit(id){

  const poem =
    publicDocs.find(
      d=>d.id === id
    );

  if(
    !poem ||
    poem.user_id !== session.user.id
  ){
    return;
  }

  state.editId =
    poem.id;

  state.category =
    poem.category ||
    CATS[0].name;

  state.title =
    poem.title || '';

  state.body =
    poem.body || '';

  state.step =
    'edit';

  state.tab =
    'public';

  renderMain();
}

/*
  CANCEL PUBLIC POEM EDIT
*/
function cancelPoemEdit(){

  state.editId = null;

  state.step =
    'category';

  state.category =
    null;

  state.title =
    '';

  state.body =
    '';

  state.tab =
    'public';

  renderMain();
}

/*
  UPDATE PUBLIC POEM
*/
async function updatePoem(){

  const title =
    document
      .getElementById('titleInput')
      ?.value
      .trim() || '';

  const body =
    document
      .getElementById('bodyInput')
      ?.value
      .trim() || '';

  if(!body){

    alert(
      'Write something first.'
    );

    return;
  }

  if(!state.editId){
    return;
  }

  const penName =
    (
      session.user.user_metadata &&
      session.user.user_metadata.pen_name
    ) || 'Anonymous';

  const { error } =
    await sb
      .from('poems')
      .update({

        title:title,

        category:
          state.category,

        body:body,

        visibility:
          'public',

        author_name:
          penName

      })
      .eq(
        'id',
        state.editId
      )
      .eq(
        'user_id',
        session.user.id
      );

  if(error){

    alert(
      'Could not save changes: ' +
      error.message
    );

    return;
  }

  state.editId = null;

  state.step =
    'category';

  state.category =
    null;

  state.title =
    '';

  state.body =
    '';

  state.tab =
    'public';

  await loadList(
    'public'
  );
}

/*
  MAKE PERSONAL POEM PUBLIC
*/
async function makePublic(id){

  const poem =
    personalDocs.find(
      d=>d.id === id
    );

  if(
    !poem ||
    poem.user_id !== session.user.id
  ){
    return;
  }

  if(!confirm(
    'Make this poem public? Other logged-in users will be able to read it.'
  )){
    return;
  }

  const penName =
    (
      session.user.user_metadata &&
      session.user.user_metadata.pen_name
    ) || 'Anonymous';

  const { error } =
    await sb
      .from('poems')
      .update({

        visibility:
          'public',

        author_name:
          penName

      })
      .eq(
        'id',
        id
      )
      .eq(
        'user_id',
        session.user.id
      );

  if(error){

    alert(
      'Could not make poem public: ' +
      error.message
    );

    return;
  }

  await loadList(
    'personal'
  );
}

/*
  SAVE NEW POEM
*/
async function savePoem(
  visibility
){

  const penName =
    (
      session.user.user_metadata &&
      session.user.user_metadata.pen_name
    ) || 'Anonymous';

  const { error } =
    await sb
      .from('poems')
      .insert({

        user_id:
          session.user.id,

        title:
          state.title,

        category:
          state.category,

        body:
          state.body,

        visibility:
          visibility,

        author_name:
          visibility === 'public'
            ? penName
            : null
      });

  if(error){

    alert(
      'Could not save: ' +
      error.message
    );

    return;
  }

  state = {
    tab:visibility,
    step:'category',
    category:null,
    title:'',
    body:'',
    publicFilter:
      state.publicFilter,
    editId:null
  };

  render();
}

/*
  LOAD POEMS
*/
async function loadList(tab){

  const { data, error } =
    await sb
      .from('poems')
      .select('*')
      .eq(
        'visibility',
        tab === 'personal'
          ? 'personal'
          : 'public'
      )
      .order(
        'created_at',
        {
          ascending:false
        }
      );

  if(!error){

    if(tab === 'personal'){

      personalDocs =
        data || [];

    }
    else{

      publicDocs =
        data || [];
    }
  }

  if(state.tab === tab){

    renderMain();
  }
}

/*
  INITIAL AUTH SESSION
*/
sb.auth
  .getSession()
  .then(({data})=>{

    session =
      data.session;

    render();
  });

/*
  AUTH STATE CHANGES
*/
sb.auth.onAuthStateChange(
  (_event,s)=>{

    session = s;

    render();
  }
);

</script>


</body>
</html>
